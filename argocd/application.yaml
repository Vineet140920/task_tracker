apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vineet140920/task_tracker.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
