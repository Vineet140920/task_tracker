name: CI - Build and push task tracker images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - 'backend-tier.yaml'
      - 'frontend-tier.yaml'
      - 'database-tier.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-backend
  FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-frontend
  DB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-db
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build database image
        uses: docker/build-push-action@v5
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ${{ env.DB_IMAGE }}:latest
            ${{ env.DB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Update manifest image tags
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          sha_tag = "${{ env.IMAGE_TAG }}"
          username = "${{ secrets.DOCKERHUB_USERNAME }}"
          desired = {
              "task-tracker-backend": f"docker.io/{username}/task-tracker-backend:{sha_tag}",
              "task-tracker-frontend": f"docker.io/{username}/task-tracker-frontend:{sha_tag}",
              "task-tracker-db": f"docker.io/{username}/task-tracker-db:{sha_tag}",
          }

          files = ["backend-tier.yaml", "database-tier.yaml", "frontend-tier.yaml"]
          changed = False

          for file_name in files:
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              new_text = text
              for image_name, replacement in desired.items():
                  pattern = rf"docker\.io/[^\s\"]+/{re.escape(image_name)}:[A-Za-z0-9._-]+"
                  new_text = re.sub(pattern, replacement, new_text)

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed = True

          print(f"Updated manifests to tag: {sha_tag}")
          print("Manifest changed" if changed else "No manifest change required")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-tier.yaml frontend-tier.yaml database-tier.yaml

          if git diff --cached --quiet; then
            echo "No manifest change required"
          else
            git commit -m "Update Kubernetes image tags to ${{ env.IMAGE_TAG }}"
            git push origin HEAD:main
          fi
