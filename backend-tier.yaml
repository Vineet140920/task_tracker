apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: api-container
        image: docker.io/vineet2026/task-tracker-backend:sha-1fb859ab0ab04360eb5a49e9ba62ca53bd832cf6
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URL
          value: mongodb://admin:mypassword123@mongodb-service:27017
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
